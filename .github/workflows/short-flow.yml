name: Short Flow

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  # The HyperRAM simulation model is proprietary and not part of this public
  # repository. Without the deploy key (e.g. pull requests from forks) every
  # simulation job is skipped instead of failing on the missing model.
  hyperram-model:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check for HyperRAM model access
        id: check
        env:
          HYPERRAM_MODEL_SSH_KEY: ${{ secrets.HYPERRAM_MODEL_SSH_KEY }}
        run: |
          if [ -n "$HYPERRAM_MODEL_SSH_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::HYPERRAM_MODEL_SSH_KEY is not available; skipping simulation jobs."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  simulation:
    needs: hyperram-model
    if: needs.hyperram-model.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.cheriot-ci.yml
      CHERIOT_CI_IMAGE: ghcr.io/${{ github.repository_owner }}/croc-iic-osic-tools:2025.12-cheriot
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk space
        uses: ./.github/actions/free-space
      - name: Install HyperRAM model
        uses: ./.github/actions/hyperram-model
        with:
          ssh-key: ${{ secrets.HYPERRAM_MODEL_SSH_KEY }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run simulation flow in OSEDA
        uses: ./.github/actions/oseda-cmd
        with:
          cmd: ".github/scripts/run_sim_flow.sh --rtl"
      - name: Upload built software
        uses: actions/upload-artifact@v4
        with:
          name: croc-sw
          path: sw/bin
      - name: Upload simulation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-output
          path: |
            verilator/croc_rtl.log
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: verilator/test*.log

  synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk space
        uses: ./.github/actions/free-space
      - name: Run synthesis flow in OSEDA
        uses: ./.github/actions/oseda-cmd
        with:
          cmd: ".github/scripts/run_synth_flow.sh"
      - name: Upload synthesis outputs
        uses: actions/upload-artifact@v4
        with:
          name: croc-synth-reports
          path: |
            yosys/reports
            yosys/out

  netlist-simulation:
    needs: [simulation, synthesis]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk space
        uses: ./.github/actions/free-space
      - name: Install HyperRAM model
        uses: ./.github/actions/hyperram-model
        with:
          ssh-key: ${{ secrets.HYPERRAM_MODEL_SSH_KEY }}
      - name: Download built software
        uses: actions/download-artifact@v4
        with:
          name: croc-sw
          path: sw/bin
      - name: Download synthesis outputs
        uses: actions/download-artifact@v4
        with:
          name: croc-synth-reports
          path: yosys
      - name: Run CMOS5L netlist simulation suite in OSEDA
        uses: ./.github/actions/oseda-cmd
        with:
          cmd: ".github/scripts/run_sim_flow.sh --netlist"
      - name: Upload netlist simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlist-simulation-logs
          path: |
            verilator/croc_netlist_yosys.log
            verilator/test*.log
